<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="escala-ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#1b396a" />
            <stop offset="100%" stop-color="#0d52a0" />
        </linearGradient>
        <linearGradient id="escala-bg" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#f0f7ff" />
            <stop offset="100%" stop-color="#ecfdf5" />
        </linearGradient>
        <linearGradient id="cana-tallo" x1="25" y1="12" x2="39" y2="54" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#22c55e" />
            <stop offset="55%" stop-color="#15803d" />
            <stop offset="100%" stop-color="#14532d" />
        </linearGradient>
        <linearGradient id="cana-hoja-izq" x1="12" y1="22" x2="30" y2="42" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4ade80" />
            <stop offset="100%" stop-color="#15803d" />
        </linearGradient>
        <linearGradient id="cana-hoja-der" x1="52" y1="16" x2="34" y2="34" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#84cc16" />
            <stop offset="100%" stop-color="#15803d" />
        </linearGradient>
    </defs>

    <!-- Fondo e insignia circular institucional -->
    <circle cx="32" cy="32" r="28" fill="url(#escala-bg)" stroke="url(#escala-ring)" stroke-width="3" />

    <!-- Marcas de medición / retícula de Escala -->
    <g stroke="#0d52a0" stroke-width="2" stroke-linecap="round" opacity="0.75">
        <line x1="32" y1="4" x2="32" y2="9" />
        <line x1="32" y1="55" x2="32" y2="60" />
        <line x1="4" y1="32" x2="9" y2="32" />
        <line x1="55" y1="32" x2="60" y2="32" />
    </g>

    <!-- Hoja izquierda -->
    <path
        d="M28.5 39C20 38 14 32 13 22.5C19.5 23.5 25.5 28.5 29 35.5Z"
        fill="url(#cana-hoja-izq)"
    />
    <path
        d="M15.5 25.5C20 28 24.5 32 28 36.5"
        stroke="#dcfce7"
        stroke-width="1.2"
        stroke-linecap="round"
        opacity="0.8"
    />

    <!-- Hoja derecha -->
    <path
        d="M35.5 30.5C43 29 49.5 23.5 51 15C44.5 16 38.5 20.5 35 27Z"
        fill="url(#cana-hoja-der)"
    />
    <path
        d="M48.5 18C44 20.5 39.5 24 36 28"
        stroke="#ecfccb"
        stroke-width="1.2"
        stroke-linecap="round"
        opacity="0.85"
    />

    <!-- Tallo segmentado de caña -->
    <rect x="27.5" y="13" width="9" height="38" rx="4.2" fill="url(#cana-tallo)" stroke="#14532d" stroke-width="1.2" />

    <!-- Brillo longitudinal del tallo -->
    <path
        d="M30 16.5V47.5"
        stroke="#bbf7d0"
        stroke-width="1.6"
        stroke-linecap="round"
        opacity="0.55"
    />

    <!-- Nudos del tallo con acento dorado -->
    <g stroke-linecap="round">
        <path d="M26.5 24.5C29.5 26 34.5 26 37.5 24.5" stroke="#fde047" stroke-width="2.4" />
        <path d="M26.5 24.5C29.5 26 34.5 26 37.5 24.5" stroke="#ca8a04" stroke-width="0.9" opacity="0.6" />
        <path d="M26.5 37.5C29.5 39 34.5 39 37.5 37.5" stroke="#fde047" stroke-width="2.4" />
        <path d="M26.5 37.5C29.5 39 34.5 39 37.5 37.5" stroke="#ca8a04" stroke-width="0.9" opacity="0.6" />
    </g>
</svg>
